name: Release zips
# Signed release zips as public GitHub release assets (no extra token: GITHUB_TOKEN, contents: write).
#   CI green on main → rolling pre-release "edge" (workflow_run: only commits whose full CI — lint, phpstan, phpunit,
#                       WordPress integration incl. the types roundtrip — passed; assets replaced in place, tag never moved)
#   tag v*       → versioned release
# Stable URLs (wp-fasty tools/playground-build.sh downloads them server-side):
#   https://github.com/phpfasty/wpmodules/releases/download/edge/{moduly,cart,orders,types,downloads,consent-log,cookie-consent,reviews,licenses}.zip + SHA256SUMS
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    # edge only from a green CI run of a push to main; tags and manual runs re-run the tests below
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Build signed zips
        env:
          MODULY_SIGNING_KEY: ${{ secrets.MODULY_SIGNING_KEY }}
        run: |
          test -n "$MODULY_SIGNING_KEY" || { echo "::error::MODULY_SIGNING_KEY missing"; exit 1; }
          bash tools/build.sh
      - name: Verify signatures with the embedded phpfasty key
        run: |
          KEY=$(sed -n "s/.*PHPFASTY = '\(.*\)';/\1/p" moduly/src/Keys.php)
          php tools/moduly.php verify dist/modules/cart-*.zip phpfasty "$KEY"
          php tools/moduly.php verify dist/modules/orders-*.zip phpfasty "$KEY" dist/modules/cart-*.zip
          php tools/moduly.php verify dist/modules/types-*.zip phpfasty "$KEY"
          php tools/moduly.php verify dist/modules/downloads-*.zip phpfasty "$KEY" dist/modules/cart-*.zip dist/modules/orders-*.zip
          php tools/moduly.php verify dist/modules/consent-log-*.zip phpfasty "$KEY" dist/modules/cart-*.zip dist/modules/orders-*.zip
          php tools/moduly.php verify dist/modules/cookie-consent-*.zip phpfasty "$KEY"
          php tools/moduly.php verify dist/modules/reviews-*.zip phpfasty "$KEY" dist/modules/cart-*.zip dist/modules/orders-*.zip
          php tools/moduly.php verify dist/modules/licenses-*.zip phpfasty "$KEY" dist/modules/cart-*.zip
      - name: Stable asset names
        run: |
          mkdir out
          cp dist/moduly-*.zip out/moduly.zip
          for z in dist/modules/*.zip; do id=$(basename "$z" | sed 's/-[0-9][0-9.]*\.zip$//'); cp "$z" "out/$id.zip"; done
          cp dist/moduly-*.zip dist/modules/*.zip out/
          (cd out && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" out/* --title "$TAG" --notes "Signed ModulY plugin and modules ($SHA)" --verify-tag
          else
            TAG=edge
            gh release view edge >/dev/null 2>&1 || gh release create edge --prerelease --title "edge (main)" --notes "Rolling build of main" --target "$SHA"
            gh release edit edge --notes "Rolling build of main at $SHA (CI green)" --prerelease
            gh release upload edge out/* --clobber
          fi
      - name: Public download check
        run: |
          TAG=${GITHUB_REF#refs/tags/}; [[ "$GITHUB_REF" == refs/tags/* ]] || TAG=edge
          for f in moduly.zip cart.zip orders.zip types.zip downloads.zip consent-log.zip cookie-consent.zip reviews.zip licenses.zip SHA256SUMS; do
            curl -fsSLo /dev/null -w "$f %{http_code}\n" "https://github.com/phpfasty/wpmodules/releases/download/$TAG/$f"
          done
