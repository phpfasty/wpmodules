name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  WP_VERSION: "7.1.4" # >= 7.1.4: CVE-2026-119977
jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.2 = floor (Requires PHP, composer platform 8.2.35); 8.5 = primary target
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sodium
          coverage: none
      - name: PHP security floor (8.5 >= 8.5.12, 8.2 >= 8.2.35; CVE-2026-109618/109619 fixed 2026-10-21)
        run: php -r '$f=["8.5"=>"8.5.12","8.2"=>"8.2.35"][PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION]??null; echo PHP_VERSION,PHP_EOL; if($f&&version_compare(PHP_VERSION,$f,"<")){fwrite(STDERR,"::error::PHP ".PHP_VERSION." < safe floor $f\n");exit(1);}'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit --locked
      - name: PHP-CS-Fixer @Symfony (check)
        run: vendor/bin/php-cs-fixer check --diff
      - name: PHPCS Symfony + WordPress.Security
        run: vendor/bin/phpcs -n
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Deptrac (architecture layers, 0 violations)
        run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress
      - run: vendor/bin/phpunit
      - name: Vendored core is CMS-agnostic (no WordPress calls)
        run: "! grep -rnE '\\b(add_action|add_filter|get_option|wp_[a-z_]+)\\(' moduly/lib/core/src"

  mutation:
    # Infection on the pure classes (infection.json5): MSI and covered MSI >= 95 %
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip, sodium
          coverage: pcov
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/infection --no-progress --threads=max --logger-github

  build:
    runs-on: ubuntu-latest
    needs: [lint-test, mutation]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip, sodium
          coverage: none
      - name: PHP security floor (8.5 >= 8.5.12, 8.2 >= 8.2.35; CVE-2026-109618/109619 fixed 2026-10-21)
        run: php -r '$f=["8.5"=>"8.5.12","8.2"=>"8.2.35"][PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION]??null; echo PHP_VERSION,PHP_EOL; if($f&&version_compare(PHP_VERSION,$f,"<")){fwrite(STDERR,"::error::PHP ".PHP_VERSION." < safe floor $f\n");exit(1);}'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Build plugin + signed modules
        env:
          MODULY_SIGNING_KEY: ${{ secrets.MODULY_SIGNING_KEY }}
        run: bash tools/build.sh
      - name: Verify module signatures against the embedded phpfasty key
        run: |
          KEY=$(sed -n "s/.*PHPFASTY = '\(.*\)';/\1/p" moduly/src/Keys.php)
          php tools/moduly.php verify dist/modules/cart-*.zip phpfasty "$KEY"
          php tools/moduly.php verify dist/modules/orders-*.zip phpfasty "$KEY" dist/modules/cart-*.zip
          php tools/moduly.php verify dist/modules/types-*.zip phpfasty "$KEY"
          php tools/moduly.php verify dist/modules/downloads-*.zip phpfasty "$KEY" dist/modules/cart-*.zip dist/modules/orders-*.zip
          php tools/moduly.php verify dist/modules/consent-log-*.zip phpfasty "$KEY" dist/modules/cart-*.zip dist/modules/orders-*.zip
          php tools/moduly.php verify dist/modules/cookie-consent-*.zip phpfasty "$KEY"
          php tools/moduly.php verify dist/modules/reviews-*.zip phpfasty "$KEY" dist/modules/cart-*.zip dist/modules/orders-*.zip
          php tools/moduly.php verify dist/modules/licenses-*.zip phpfasty "$KEY" dist/modules/cart-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wordpress:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mysqli, opcache
          tools: wp-cli
          coverage: none
      - name: PHP security floor (8.5 >= 8.5.12, 8.2 >= 8.2.35; CVE-2026-109618/109619 fixed 2026-10-21)
        run: php -r '$f=["8.5"=>"8.5.12","8.2"=>"8.2.35"][PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION]??null; echo PHP_VERSION,PHP_EOL; if($f&&version_compare(PHP_VERSION,$f,"<")){fwrite(STDERR,"::error::PHP ".PHP_VERSION." < safe floor $f\n");exit(1);}'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install WordPress
        run: |
          mkdir site && cd site
          wp core download --version="$WP_VERSION" --quiet
          php -r 'require "wp-includes/version.php"; echo "WordPress $wp_version\n"; if (version_compare($wp_version, getenv("WP_VERSION"), "<")) { fwrite(STDERR, "::error::WordPress $wp_version < $WP_VERSION floor\n"); exit(1); }'
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp config set WP_ENVIRONMENT_TYPE production
          wp core install --url=http://localhost --title=ModulY --admin_user=admin --admin_password=admin --admin_email=a@example.com --skip-email --quiet
      - name: Install + activate ModulY from the release zip
        working-directory: site
        run: |
          wp plugin install ../dist/moduly-*.zip --activate
          wp plugin list --name=moduly --field=status | grep -qx active
      - name: Install signed modules through the validated installer
        working-directory: site
        run: |
          wp moduly install ../dist/modules/cart-*.zip --enable
          wp moduly install ../dist/modules/orders-*.zip --enable
          wp moduly install ../dist/modules/downloads-*.zip --enable
          wp moduly install ../dist/modules/consent-log-*.zip --enable
          wp moduly install ../dist/modules/cookie-consent-*.zip --enable
          wp moduly install ../dist/modules/reviews-*.zip --enable
          wp moduly list
          wp moduly status
          test "$(wp moduly list --format=json | php -r '$m=json_decode(stream_get_contents(STDIN),true);echo count(array_filter($m,fn($r)=>$r["status"]==="enabled"));')" = "6"
      - name: Cart/orders are wired (filters, handlers)
        working-directory: site
        run: |
          wp eval '$s = apply_filters("wpfasty_shop_state", []); if (empty($s["enabled"])) { exit(1); } echo "shop enabled\n";'
          wp eval 'foreach (["admin_post_nopriv_moduly_cart","admin_post_moduly_cart","admin_post_moduly_checkout","admin_post_nopriv_latte_shop_cart","admin_post_latte_shop_cart","admin_post_latte_shop_checkout"] as $h) { if (!has_action($h)) { echo "missing $h\n"; exit(1); } } echo "handlers ok\n";'
      - name: Disable scenario — a disabled module's form answers 503, not a blank page
        working-directory: site
        run: |
          # opcache on for PHP 8.5 (as in wp-fasty CI), off on 8.2 (8.2.35 php -S segfaulted with it)
          OPC=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION === "8.5" ? 1 : 0;')
          php -d opcache.enable=$OPC -d opcache.enable_cli=$OPC -d opcache.revalidate_freq=0 -S 127.0.0.1:8080 -t . >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/wp-login.php && break; sleep 1; done
          curl -s http://127.0.0.1:8080/wp-login.php -o /dev/null -w "php -S opcache=$OPC: %{http_code}\n"
          # Dependents first: downloads (and, where installed, consent-log / reviews) require orders.
          wp moduly disable downloads
          curl -s -D /tmp/h2.txt -o /tmp/b2.html 'http://127.0.0.1:8080/wp-admin/admin-post.php?action=moduly_download&o=1&i=0&e=1&s=x'
          grep -q '^HTTP/1.1 503' /tmp/h2.txt
          grep -q 'Temporarily unavailable' /tmp/b2.html
          DEPENDENTS=$(wp moduly list --format=json | php -r '$m=json_decode(stream_get_contents(STDIN),true);echo implode(" ",array_column(array_filter($m,fn($r)=>$r["status"]==="enabled"&&in_array($r["id"],["consent-log","reviews"],true)),"id"));')
          for m in $DEPENDENTS; do wp moduly disable "$m"; done
          wp moduly disable orders
          curl -s -D /tmp/h.txt -o /tmp/b.html -d 'action=moduly_checkout' http://127.0.0.1:8080/wp-admin/admin-post.php
          # deprecated alias answers 503 as well
          test "$(curl -s -o /dev/null -w '%{http_code}' -d 'action=latte_shop_checkout' http://127.0.0.1:8080/wp-admin/admin-post.php)" = "503"
          cat /tmp/h.txt
          grep -q '^HTTP/1.1 503' /tmp/h.txt
          grep -qi '^Retry-After: 300' /tmp/h.txt
          grep -qi 'no-cache\|no-store' /tmp/h.txt
          grep -q 'Temporarily unavailable' /tmp/b.html
          grep -q 'Back to site' /tmp/b.html
          wp moduly enable orders
          for m in $DEPENDENTS; do wp moduly enable "$m"; done
          wp moduly enable downloads
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/wp-admin/admin-post.php?action=moduly_download&o=1&i=0&e=1&s=x')" = "403"
          curl -s -o /dev/null -w '%{http_code}\n' -d 'action=moduly_checkout' http://127.0.0.1:8080/wp-admin/admin-post.php | grep -qv '^503$'
      - name: Types module — old schema → migrate → switch theme → back, disable/enable, prune (meta intact)
        working-directory: site
        run: |
          # themes + types plugin from the wp-fasty rolling `playground` release (built from wp-fasty main)
          mkdir -p ../themes
          for f in wp-fasty latte-shop wpfasty-types; do
            curl -fsSL --retry 3 -o "../themes/$f.zip" "https://github.com/alexy-os/wp-fasty/releases/download/playground/$f.zip"
          done
          bash ../tests/wp/types-roundtrip.sh ../dist ../themes
      - name: N+1 guard — query count of shop / product / cart / checkout does not grow with items
        working-directory: site
        run: |
          wp option update home http://127.0.0.1:8080 --quiet && wp option update siteurl http://127.0.0.1:8080 --quiet
          wp rewrite structure '/%postname%/' --hard --quiet
          wp theme activate latte-shop --quiet
          if ! curl -s -o /dev/null http://127.0.0.1:8080/wp-login.php; then
            OPC=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION === "8.5" ? 1 : 0;')
            php -d opcache.enable=$OPC -d opcache.revalidate_freq=0 -S 127.0.0.1:8080 -t . >/tmp/server2.log 2>&1 &
            for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/wp-login.php && break; sleep 1; done
          fi
          bash ../tests/wp/query-budget.sh http://127.0.0.1:8080 3
      - name: Tampered package is rejected
        working-directory: site
        run: |
          mkdir t && cd t && unzip -q ../../dist/modules/cart-*.zip && echo "// x" >> cart/src/Money.php && php ../../tools/moduly.php pack cart ../tampered.zip
          cd .. && ! wp moduly install tampered.zip --force
      - name: Plugin Check (0 errors required)
        working-directory: site
        run: |
          wp plugin install plugin-check --activate --quiet
          wp plugin check moduly --format=table | tee /tmp/pc.txt
          ! grep -P '\tERROR\t' /tmp/pc.txt
