name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sodium
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs -n
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/phpunit
      - name: Vendored core is CMS-agnostic (no WordPress calls)
        run: "! grep -rnE '\\b(add_action|add_filter|get_option|wp_[a-z_]+)\\(' moduly/lib/core/src"

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Build plugin + signed modules
        env:
          MODULY_SIGNING_KEY: ${{ secrets.MODULY_SIGNING_KEY }}
        run: bash tools/build.sh
      - name: Verify module signatures against the embedded phpfasty key
        run: |
          KEY=$(sed -n "s/.*PHPFASTY = '\(.*\)';/\1/p" moduly/src/Keys.php)
          php tools/moduly.php verify dist/modules/cart-*.zip phpfasty "$KEY"
          php tools/moduly.php verify dist/modules/orders-*.zip phpfasty "$KEY" dist/modules/cart-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wordpress:
    runs-on: ubuntu-latest
    needs: build
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mysqli
          tools: wp-cli
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install WordPress
        run: |
          mkdir site && cd site
          wp core download --quiet
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp config set WP_ENVIRONMENT_TYPE production
          wp core install --url=http://localhost --title=ModulY --admin_user=admin --admin_password=admin --admin_email=a@example.com --skip-email --quiet
      - name: Install + activate ModulY from the release zip
        working-directory: site
        run: |
          wp plugin install ../dist/moduly-*.zip --activate
          wp plugin list --name=moduly --field=status | grep -qx active
      - name: Install signed modules through the validated installer
        working-directory: site
        run: |
          wp moduly install ../dist/modules/cart-*.zip --enable
          wp moduly install ../dist/modules/orders-*.zip --enable
          wp moduly list
          wp moduly status
          test "$(wp moduly list --format=json | php -r '$m=json_decode(stream_get_contents(STDIN),true);echo count(array_filter($m,fn($r)=>$r["status"]==="enabled"));')" = "2"
      - name: Cart/orders are wired (filters, handlers)
        working-directory: site
        run: |
          wp eval '$s = apply_filters("wpfasty_shop_state", []); if (empty($s["enabled"])) { exit(1); } echo "shop enabled\n";'
          wp eval 'foreach (["admin_post_nopriv_latte_shop_cart","admin_post_latte_shop_cart","admin_post_latte_shop_checkout"] as $h) { if (!has_action($h)) { echo "missing $h\n"; exit(1); } } echo "handlers ok\n";'
      - name: Disable scenario — a disabled module's form answers 503, not a blank page
        working-directory: site
        run: |
          wp moduly disable orders
          wp server --host=127.0.0.1 --port=8080 >/tmp/server.log 2>&1 &
          sleep 3
          curl -s -D /tmp/h.txt -o /tmp/b.html -d 'action=latte_shop_checkout' http://127.0.0.1:8080/wp-admin/admin-post.php
          cat /tmp/h.txt
          grep -q '^HTTP/1.1 503' /tmp/h.txt
          grep -qi '^Retry-After: 300' /tmp/h.txt
          grep -qi 'no-cache\|no-store' /tmp/h.txt
          grep -q 'Temporarily unavailable' /tmp/b.html
          grep -q 'Back to site' /tmp/b.html
          wp moduly enable orders
          curl -s -o /dev/null -w '%{http_code}\n' -d 'action=latte_shop_checkout' http://127.0.0.1:8080/wp-admin/admin-post.php | grep -qv '^503$'
      - name: Tampered package is rejected
        working-directory: site
        run: |
          mkdir t && cd t && unzip -q ../../dist/modules/cart-*.zip && echo "// x" >> cart/src/Money.php && php ../../tools/moduly.php pack cart ../tampered.zip
          cd .. && ! wp moduly install tampered.zip --force
      - name: Plugin Check (report)
        working-directory: site
        continue-on-error: true
        run: |
          wp plugin install plugin-check --activate --quiet
          wp plugin check moduly --exclude-checks=plugin_updater --format=table
